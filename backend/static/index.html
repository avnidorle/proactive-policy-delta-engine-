<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Policy Delta Engine - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">
  <header class="bg-emerald-700 text-white p-4 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">🌾 Proactive Policy Delta Engine</h1>
      <span class="text-xs bg-emerald-800 px-3 py-1 rounded-full border border-emerald-500">AgriStack Integration</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
    <!-- Left Column: Trigger Policy Delta -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-semibold text-slate-900 mb-4 border-b pb-2">1. Simulate Policy Update (Delta)</h2>
      
      <form id="deltaForm" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Scheme Name</label>
          <input type="text" id="scheme_name" value="PM-Kisan Maharashtra Bonus Subsidy" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" required>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Portal Source</label>
          <input type="text" id="portal_source" value="https://krishi.maharashtra.gov.in" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" required>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Target State</label>
            <input type="text" id="target_state" value="Maharashtra" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Max Land (Hectares)</label>
            <input type="number" step="0.1" id="max_land" value="2.0" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Summary Diff (Detected Delta)</label>
          <input type="text" id="summary_diff" value="Deadline extended by 15 days; e-KYC mandatory via CSC" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" required>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Actionable Farmer Instruction</label>
          <textarea id="actionable_instruction" rows="2" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">Visit local CSC with Khatauni document before Friday</textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg text-sm transition">
          🚀 Run Delta Engine & Dispatch Alerts
        </button>
      </form>
    </section>

    <!-- Right Column: Results & Voice Dispatches -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col">
      <h2 class="text-lg font-semibold text-slate-900 mb-4 border-b pb-2">2. Hyper-Targeted Voice Dispatches</h2>
      
      <div id="statusMessage" class="text-sm text-slate-500 mb-3 italic">
        Submit a delta update on the left to view matched farmers and generated regional scripts.
      </div>

      <div id="resultsContainer" class="space-y-3 overflow-y-auto max-h-[500px] flex-1">
        <!-- Result cards injected by JS -->
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('deltaForm');
    const resultsContainer = document.getElementById('resultsContainer');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusMessage.innerText = "Processing rule engine & generating voice dispatches...";
      resultsContainer.innerHTML = "";

      const payload = {
        scheme_name: document.getElementById('scheme_name').value,
        portal_source: document.getElementById('portal_source').value,
        change_type: "DEADLINE_EXTENSION",
        summary_diff: document.getElementById('summary_diff').value,
        target_criteria: {
          state: document.getElementById('target_state').value,
          max_land: parseFloat(document.getElementById('max_land').value)
        },
        actionable_instruction: document.getElementById('actionable_instruction').value,
        csc_contact: "Nearest CSC: District Centre (Toll-Free: 1800-180-1551)"
      };

      try {
        const response = await fetch('/api/v1/trigger-delta-alert', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        statusMessage.innerHTML = `<span class="text-emerald-600 font-semibold">Matched ${data.total_affected_farmers} farmer(s) out of AgriStack registry.</span>`;

        data.dispatched_alerts.forEach(alert => {
          const card = document.createElement('div');
          card.className = "p-4 border rounded-lg bg-emerald-50/50 border-emerald-200 text-sm";
          card.innerHTML = `
            <div class="flex justify-between items-start mb-2">
              <span class="font-bold text-slate-800">${alert.name} (${alert.farmer_id})</span>
              <span class="text-xs bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded font-mono">${alert.language.toUpperCase()}</span>
            </div>
            <p class="text-xs text-slate-500 mb-2">📞 ${alert.phone} | ${alert.delivery_channel}</p>
            <div class="bg-white p-2.5 rounded border border-emerald-100 text-xs font-mono text-slate-700 mb-2">
              🔊 <strong>Audio Script:</strong> "${alert.audio_script}"
            </div>
            <p class="text-[11px] text-slate-600">📍 <strong>Dead-End Support:</strong> ${alert.nearest_csc_support}</p>
          `;
          resultsContainer.appendChild(card);
        });

      } catch (err) {
        statusMessage.innerHTML = `<span class="text-red-500">Error: Make sure the FastAPI server is running.</span>`;
      }
    });
  </script>
</body>
</html>
